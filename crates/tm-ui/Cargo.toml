[package]
name = "tm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
tm-core = { path = "../tm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.eframe]
version = "0.31"
default-features = false
features = ["glow", "default_fonts"]

[build-dependencies]
winres = "0.1"
